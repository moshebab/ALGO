<h1 id="%D7%9E%D7%91%D7%A2%D7%99%D7%95%D7%AA-%D7%A7%D7%A9%D7%95%D7%AA-%D7%9C%D7%90%D7%9C%D7%92%D7%95%D7%A8%D7%99%D7%AA%D7%9E%D7%99-%D7%A7%D7%99%D7%A8%D7%95%D7%91">מבעיות קשות לאלגוריתמי קירוב</h1>
<div class="cols">
<div>
<p><strong>עד כה בקורס</strong></p>
<p>בהינתן בעיית אופטימיזציה (מקסום / מזעור), חיפשנו אלגוריתם <strong>פולינומי</strong> המוצא פתרון <strong>אופטימלי</strong> לכל קלט.</p>
</div>
<div data-marpit-fragment>
<p><strong>כשבעיה קשה לחישוב (NP-hard)</strong></p>
<p>לא ידוע אלגוריתם פולינומי המוצא פתרון אופטימלי לכל קלט.</p>
<p><strong>אלגוריתם קירוב:</strong> אלגוריתם <strong>פולינומי</strong> המוצא פתרון <strong>מקרב</strong> (עם ערובה מוכחת על מידת הקרבה לאופטימום) לכל קלט.</p>
</div>
</div>
