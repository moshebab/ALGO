<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איזון עומסים (Load Balancing) — הדגמת האלגוריתמים</title>
<style>
  :root {
    --navy: #16325c;
    --navy-soft: #eef2f7;
    --blue-avg: #1d6fa5;
    --gold: #c8a44d;
    --gold-bg: #f6ecd2;
    --red: #b23b3b;
    --green: #2b7a4b;
    --ink: #1c1c1c;
    --muted: #5a6270;
    --gray: #c9ccd1;
    --rule: #d8dbe2;
  }
  * { box-sizing: border-box; }
  span[dir="ltr"], b[dir="ltr"] { unicode-bidi: isolate; }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: var(--ink);
    font-family: 'Helvetica Neue', 'Arial Hebrew', 'Noto Sans Hebrew', Arial, sans-serif;
  }
  body {
    max-width: 1060px;
    margin: 0 auto;
    padding: 6px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* Fixed-height Header (38px) */
  header {
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 4px;
    gap: 8px;
    flex: none;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    color: var(--navy);
    font-weight: 700;
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    gap: 4px;
    flex: none;
  }
  .tab-btn {
    border: 1.5px solid var(--navy);
    background: #fff;
    color: var(--navy);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .tab-btn:hover {
    background: var(--navy-soft);
  }
  .tab-btn.active {
    background: var(--navy);
    color: #fff;
  }

  /* K selector */
  .k-selector {
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--gold-bg);
    border: 1.5px solid var(--gold);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--navy);
  }
  .k-selector.visible {
    display: inline-flex;
  }
  .k-btn {
    border: 1.5px solid var(--navy);
    background: #fff;
    color: var(--navy);
    font-weight: 700;
    font-size: 0.84rem;
    width: 25px;
    height: 23px;
    border-radius: 5px;
    cursor: pointer;
    padding: 0;
  }
  .k-btn.active {
    background: var(--navy);
    color: #fff;
  }

  /* Fixed-height Job queue bar (50px) */
  .queue-bar {
    height: 50px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fafbfd;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    padding: 0 14px;
    flex: none;
  }
  .queue-title {
    font-weight: 700;
    color: var(--navy);
    font-size: 1.02rem;
    min-width: 135px;
    white-space: nowrap;
  }
  .job-pills {
    display: flex;
    align-items: center;
    gap: 6px;
    direction: ltr;
  }
  .job-pill {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 38px;
    border-radius: 6px;
    border: 1.5px solid var(--navy);
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    transition: transform 0.18s, opacity 0.18s, box-shadow 0.18s;
  }
  .job-pill .j-idx {
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.9);
    line-height: 1;
    font-weight: 600;
  }
  .job-pill .j-val {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .job-pill.done {
    opacity: 0.32;
  }
  .job-pill.current {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--gold), 0 3px 8px rgba(22,50,92,0.25);
    z-index: 2;
  }

  /* Fixed-height Schedule panel container (222px) so controls below NEVER jump */
  .panels {
    height: 222px;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    gap: 8px;
    flex: none;
  }
  .panels.compare-grid {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .panels.two-col {
    grid-template-columns: 1fr 1fr;
  }
  .panel {
    background: #fff;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .panel.main-panel {
    border-color: var(--navy);
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--rule);
    flex: none;
  }
  .panel-title {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
  }
  .panels.compare-grid .panel-title {
    font-size: 0.92rem;
  }
  .panel-score {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-weight: 700;
    direction: ltr;
    white-space: nowrap;
  }
  .panels.compare-grid .panel-score {
    font-size: 0.95rem;
  }
  .panel svg {
    width: 100%;
    height: 100%;
    max-height: 175px;
    display: block;
    direction: ltr;
  }
  .panels.compare-grid .panel svg {
    max-height: 115px;
  }

  /* Fixed-height Minimal caption & formula (46px) */
  .caption-area {
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--gold-bg);
    border-right: 5px solid var(--gold);
    border-radius: 6px;
    padding: 0 14px;
    flex: none;
    overflow: hidden;
  }
  .caption-text {
    font-size: 1.05rem;
    line-height: 1.25;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .formula-pill {
    direction: ltr;
    unicode-bidi: isolate;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.06rem;
    font-weight: 700;
    background: #fff;
    border: 1.5px solid #dfd3b2;
    border-radius: 6px;
    padding: 4px 10px;
    color: var(--navy);
    white-space: nowrap;
    flex: none;
  }
  .formula-pill .hl-red { color: var(--red); }
  .formula-pill .hl-green { color: var(--green); }

  /* Controls bar (38px) */
  .bar {
    height: 38px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    direction: ltr;
    flex: none;
  }
  .nav-btn {
    font: inherit;
    font-size: 1.3rem;
    line-height: 1;
    width: 48px;
    height: 34px;
    border: 1.5px solid var(--navy);
    background: #fff;
    color: var(--navy);
    border-radius: 7px;
    cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--navy-soft);
  }
  .nav-btn:disabled {
    border-color: var(--gray);
    color: var(--gray);
    cursor: not-allowed;
  }
  .count {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 700;
    min-width: 65px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .ref-toggle {
    border: 1.5px solid var(--navy);
    background: #fff;
    color: var(--navy);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    height: 34px;
    padding: 0 10px;
    border-radius: 7px;
    cursor: pointer;
    direction: rtl;
  }
  .ref-toggle.opt-btn {
    margin-left: 12px;
    border-color: var(--green);
    color: var(--green);
  }
  .ref-toggle.opt-btn.active {
    background: var(--green);
    color: #fff;
  }
  .ref-toggle.avg-btn {
    border-color: var(--blue-avg);
    color: var(--blue-avg);
  }
  .ref-toggle.avg-btn.active {
    background: var(--blue-avg);
    color: #fff;
  }
  .ref-toggle:disabled {
    border-color: var(--gray);
    background: #fff;
    color: var(--gray);
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <h1>איזון עומסים (<span dir="ltr">Load Balancing</span>) — הדמיה</h1>
  <div class="tabs">
    <button class="tab-btn" data-jump="0">0. הקלט</button>
    <button class="tab-btn" data-jump="1">1. אופטימום (<span dir="ltr">OPT</span>)</button>
    <button class="tab-btn" data-jump="2">2. חמדן ללא מיון</button>
    <button class="tab-btn" data-jump="10">3. הדוקות הניתוח לכל <span dir="ltr">k</span></button>
    <button class="tab-btn" data-jump="11">4. חמדן ממוין (<span dir="ltr">LPT</span>)</button>
    <button class="tab-btn" data-jump="19">5. השוואה</button>
  </div>
  <div class="k-selector" id="kSelector">
    <span>בחר <span dir="ltr">k</span>:</span>
    <button class="k-btn" data-k="2">2</button>
    <button class="k-btn active" data-k="3">3</button>
    <button class="k-btn" data-k="4">4</button>
    <button class="k-btn" data-k="5">5</button>
  </div>
</header>

<div class="queue-bar" id="queueBar"></div>

<div class="panels" id="panelsContainer"></div>

<div class="caption-area">
  <div class="caption-text" id="captionText"></div>
  <div class="formula-pill" id="formulaBox"></div>
</div>

<div class="bar">
  <button class="nav-btn" id="resetBtn" title="התחלה (Home)">↺</button>
  <button class="nav-btn" id="prevBtn" title="הקודם (←)">←</button>
  <span class="count" id="counter"></span>
  <button class="nav-btn" id="nextBtn" title="הבא (→ או רווח)">→</button>
  <button class="ref-toggle opt-btn active" id="optToggleBtn" title="הצג/הסתר קו OPT = 10">קו <span dir="ltr">OPT</span></button>
  <button class="ref-toggle avg-btn" id="avgToggleBtn" title="הצג/הסתר קו Avg = 9⅓">קו <span dir="ltr">Avg</span></button>
</div>

<script>
const UNSORTED_JOBS = [3, 3, 3, 4, 5, 4, 6];
const SORTED_JOBS   = [6, 5, 4, 4, 3, 3, 3];
const AVG_LOAD = 28 / 3; // 9.333...
const OPT_LOAD = 10;

const JOB_COLORS = {
  1: { fill: '#3a5a8c', border: '#253d61' },
  3: { fill: '#2b6cb0', border: '#1e4e8c' },
  4: { fill: '#0f766e', border: '#115e59' },
  5: { fill: '#6b46c1', border: '#44337a' },
  6: { fill: '#c53030', border: '#822727' }
};

// Unsorted assignments on [3, 3, 3, 4, 5, 4, 6]:
const UNSORTED_ASSIGN = [0, 1, 2, 0, 1, 2, 2];

// Sorted (LPT) assignments on [6, 5, 4, 4, 3, 3, 3]:
const SORTED_ASSIGN   = [0, 1, 2, 2, 1, 0, 2];

// Optimal schedule: M1: {6,3}=9, M2: {5,4}=9, M3: {4,3,3}=10
const OPT_MACHINES = [
  [{ len: 6 }, { len: 3 }],
  [{ len: 5 }, { len: 4 }],
  [{ len: 4 }, { len: 3 }, { len: 3 }]
];

function buildPrefixMachines(jobs, assigns, upTo) {
  const machines = [[], [], []];
  for (let s = 0; s < upTo; s++) {
    machines[assigns[s]].push({
      len: jobs[s],
      isLatest: s === upTo - 1
    });
  }
  return machines;
}

function getLoads(machines) {
  return machines.map(m => m.reduce((sum, jb) => sum + jb.len, 0));
}

function buildSteps() {
  const steps = [];

  // Step 0: Input only
  steps.push({
    tab: 0,
    mode: 'input_only',
    upTo: 0,
    caption: '<b>הקלט:</b> <b dir="ltr">k = 3</b> מכונות זהות ו-<b dir="ltr">n = 7</b> משימות באורכים <b dir="ltr">(3, 3, 3, 4, 5, 4, 6)</b>.',
    formula: 'k = 3 ,  n = 7 ,  ∑ tⱼ = 28'
  });

  // Step 1: Optimal solution (OPT) — without forcing OPT/Avg lines
  steps.push({
    tab: 1,
    mode: 'opt_only',
    upTo: 7,
    caption: '<b>הפתרון האופטימלי <span dir="ltr">S<sup>*</sup></span>:</b> חלוקה לעומסים <b dir="ltr">(9, 9, 10)</b> — זמן הסיום המינימלי הוא <b dir="ltr" style="color:var(--green)">OPT = 10</b>.',
    formula: 'max(9, 9, 10) = <span class="hl-green">10 = OPT</span>'
  });

  // Step 2: Unsorted Greedy init
  steps.push({
    tab: 2,
    mode: 'unsorted',
    upTo: 0,
    caption: '<b>חמדן ללא מיון:</b> עוברים על המשימות בסדר הגעתן <b dir="ltr">(3, 3, 3, 4, 5, 4, 6)</b>. כל המכונות ריקות.',
    formula: 'T₁ = 0 ,  T₂ = 0 ,  T₃ = 0'
  });

  // Steps 3..9: Unsorted step-by-step (j = 1..7)
  for (let s = 1; s <= 7; s++) {
    const prevLoads = getLoads(buildPrefixMachines(UNSORTED_JOBS, UNSORTED_ASSIGN, s - 1));
    const mIdx = UNSORTED_ASSIGN[s - 1];
    const len = UNSORTED_JOBS[s - 1];
    const minVal = prevLoads[mIdx];
    const newLoad = minVal + len;
    const afterLoads = [...prevLoads];
    afterLoads[mIdx] = newLoad;
    const makespan = Math.max(...afterLoads);

    const endNote = (s === 7) ? ` &mdash; <b>זמן הסיום: <span dir="ltr" style="color:var(--red)">13</span></b>` : '';
    steps.push({
      tab: 2,
      mode: 'unsorted',
      upTo: s,
      chosenM: mIdx,
      caption: `משימה <b dir="ltr">j = ${s}</b> (אורך <b>${len}</b>) משובצת למכונה הפנויה ביותר <b dir="ltr">M${mIdx + 1}</b> (עומס <b>${minVal}</b>)${endNote}.`,
      formula: `min(${prevLoads.join(', ')}) = ${minVal}  ⇒  M${mIdx + 1}: ${minVal} + ${len} = <span class="hl-red">${newLoad}</span>` + (s === 7 ? `  (q = ${makespan})` : '')
    });
  }

  // Step 10: Tightness of analysis for unsorted greedy (general k, selectable 2, 3, 4, 5)
  const onesCount = tightK * (tightK - 1);
  const qGTight = 2 * tightK - 1;
  const ratioTight = (qGTight / tightK).toFixed(3);
  steps.push({
    tab: 3,
    mode: 'tightness',
    caption: `<b>קלט הקצה ההדוק לחמדן ללא מיון (<span dir="ltr">k = ${tightK}</span>):</b> <b dir="ltr">k(k−1) = ${onesCount}</b> משימות באורך <b>1</b>, ואחריהן משימה אחת באורך <b dir="ltr">k = ${tightK}</b>.`,
    formula: `q(G) = 2k − 1 = ${qGTight} ,  q(S*) = k = ${tightK}  ⇒  <span class="hl-red">q(G) / q(S*) = 2 − 1/k = ${qGTight}/${tightK} ≈ ${ratioTight}</span>`
  });

  // Step 11: Sorted (LPT) init
  steps.push({
    tab: 4,
    mode: 'sorted',
    upTo: 0,
    caption: '<b>חמדן ממוין (<span dir="ltr">LPT</span>):</b> ממיינים את המשימות מהגדולה לקטנה <b dir="ltr">(6, 5, 4, 4, 3, 3, 3)</b>.',
    formula: 'T₁ = 0 ,  T₂ = 0 ,  T₃ = 0'
  });

  // Steps 12..18: Sorted step-by-step (j = 1..7)
  for (let s = 1; s <= 7; s++) {
    const prevLoads = getLoads(buildPrefixMachines(SORTED_JOBS, SORTED_ASSIGN, s - 1));
    const mIdx = SORTED_ASSIGN[s - 1];
    const len = SORTED_JOBS[s - 1];
    const minVal = prevLoads[mIdx];
    const newLoad = minVal + len;
    const afterLoads = [...prevLoads];
    afterLoads[mIdx] = newLoad;
    const makespan = Math.max(...afterLoads);

    const endNote = (s === 7) ? ` &mdash; <b>זמן הסיום: <span dir="ltr" style="color:var(--green)">11</span></b>` : '';
    steps.push({
      tab: 4,
      mode: 'sorted',
      upTo: s,
      chosenM: mIdx,
      caption: `משימה <b dir="ltr">j = ${s}</b> (אורך <b>${len}</b>) משובצת למכונה הפנויה ביותר <b dir="ltr">M${mIdx + 1}</b> (עומס <b>${minVal}</b>)${endNote}.`,
      formula: `min(${prevLoads.join(', ')}) = ${minVal}  ⇒  M${mIdx + 1}: ${minVal} + ${len} = <span class="hl-green">${newLoad}</span>` + (s === 7 ? `  (q = ${makespan})` : '')
    });
  }

  // Step 19: Compare all 3 schedules
  steps.push({
    tab: 5,
    mode: 'compare',
    caption: '<b>השוואת שלושת הפתרונות:</b> חמדן ללא מיון (<b>13</b>), חמדן ממוין <span dir="ltr">LPT</span> (<b>11</b>), והפתרון האופטימלי (<b>10</b>).',
    formula: '<span class="hl-green">OPT = 10</span>  &lt;  <span>LPT = 11</span>  &lt;  <span class="hl-red">Greedy = 13</span>'
  });

  return steps;
}

let currentStepIdx = 0;
let tightK = 3;
let showOptLine = true;
let showAvgLine = false;

function renderScheduleSVG(machines, opts = {}) {
  const k = machines.length;
  const maxAxis = opts.maxAxis || 14;
  const optVal = (opts.optBound !== undefined) ? opts.optBound : OPT_LOAD;
  const optLabel = opts.optLabel || `OPT = ${optVal}`;
  const avgVal = (opts.avgBound !== undefined) ? opts.avgBound : AVG_LOAD;
  const avgLabel = opts.avgLabel || (avgVal === AVG_LOAD ? 'Avg = 9⅓' : `Avg = ${avgVal}`);
  const rowH = opts.compact ? 26 : 42;
  // Constant topPad so toggling OPT / Avg lines never shifts the SVG height
  const topPad = opts.compact ? 20 : 24;
  const bottomPad = opts.compact ? 18 : 22;
  const H = topPad + k * rowH + bottomPad;
  const W = opts.width || 820;
  const leftX = 54;
  const rightPad = 48;
  const plotW = W - leftX - rightPad;
  const scale = plotW / maxAxis;

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;

  // Grid lines & axis numbers
  for (let t = 0; t <= maxAxis; t++) {
    const x = leftX + t * scale;
    svg += `<line x1="${x.toFixed(1)}" y1="${topPad - 4}" x2="${x.toFixed(1)}" y2="${topPad + k * rowH}" stroke="#eef0f4" stroke-width="1.2"/>`;
    svg += `<text x="${x.toFixed(1)}" y="${topPad + k * rowH + (opts.compact ? 16 : 20)}" text-anchor="middle" font-size="${opts.compact ? 12 : 14}" font-weight="700" fill="#5a6270">${t}</text>`;
  }

  // Machine bars
  const loads = getLoads(machines);
  const maxLoad = Math.max(0, ...loads);

  for (let i = 0; i < k; i++) {
    const y = topPad + i * rowH;
    const barH = rowH - (opts.compact ? 8 : 12);
    const isChosen = (i === opts.chosenM);

    svg += `<text x="${leftX - 10}" y="${y + barH / 2 + 5}" text-anchor="end" font-size="${opts.compact ? 13.5 : 16}" font-weight="700" fill="${isChosen ? '#b23b3b' : '#16325c'}">M${i + 1}</text>`;
    svg += `<rect x="${leftX}" y="${y}" width="${plotW}" height="${barH}" fill="${isChosen ? '#fdf6e4' : '#f6f7f9'}" stroke="${isChosen ? '#c8a44d' : '#e2e5ec'}" stroke-width="1.4" rx="4"/>`;

    let curT = 0;
    for (const jb of machines[i]) {
      const bx = leftX + curT * scale;
      const bw = jb.len * scale;
      curT += jb.len;
      const c = JOB_COLORS[jb.len] || { fill: '#16325c' };

      svg += `<rect x="${bx.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${barH}" fill="${c.fill}" stroke="#ffffff" stroke-width="1.8" rx="4"/>`;
      if (jb.isLatest) {
        svg += `<rect x="${(bx + 2).toFixed(1)}" y="${(y + 2).toFixed(1)}" width="${Math.max(0, bw - 4).toFixed(1)}" height="${barH - 4}" fill="none" stroke="#ffd166" stroke-width="3" rx="3"/>`;
      }
      svg += `<text x="${(bx + bw / 2).toFixed(1)}" y="${y + barH / 2 + 5}" text-anchor="middle" font-family="Georgia, serif" font-size="${opts.compact ? 13.5 : 16}" font-weight="700" fill="#ffffff">${jb.len}</text>`;
    }

    const totalX = leftX + curT * scale + 8;
    const isMax = (curT === maxLoad && maxLoad > 0);
    const loadColor = isMax ? (curT > optVal ? '#b23b3b' : '#2b7a4b') : '#1c1c1c';
    svg += `<text x="${totalX.toFixed(1)}" y="${y + barH / 2 + 5}" text-anchor="start" font-family="Georgia, serif" font-size="${opts.compact ? 14 : 17}" font-weight="700" fill="${loadColor}">${curT}</text>`;
  }

  // Independent Average line
  if (showAvgLine && !opts.hideAvg) {
    const avgX = leftX + avgVal * scale;
    svg += `<line x1="${avgX.toFixed(1)}" y1="${topPad - 6}" x2="${avgX.toFixed(1)}" y2="${topPad + k * rowH + 3}" stroke="#1d6fa5" stroke-width="2.2" stroke-dasharray="5 3"/>`;
    svg += `<text x="${(avgX - 5).toFixed(1)}" y="${topPad - 9}" text-anchor="end" font-size="${opts.compact ? 11.5 : 13.5}" font-weight="700" fill="#1d6fa5">${avgLabel}</text>`;
  }

  // Optimal line
  if (showOptLine && currentStepIdx >= 1 && !opts.hideOpt) {
    const optX = leftX + optVal * scale;
    svg += `<line x1="${optX.toFixed(1)}" y1="${topPad - 6}" x2="${optX.toFixed(1)}" y2="${topPad + k * rowH + 3}" stroke="#2b7a4b" stroke-width="2.4" stroke-dasharray="6 3"/>`;
    svg += `<text x="${(optX + 5).toFixed(1)}" y="${topPad - 9}" text-anchor="start" font-size="${opts.compact ? 11.5 : 13.5}" font-weight="700" fill="#2b7a4b">${optLabel}</text>`;
  }

  svg += `</svg>`;
  return svg;
}

function renderQueue(step) {
  const qBar = document.getElementById('queueBar');

  if (step.mode === 'tightness') {
    const k = tightK;
    const ones = k * (k - 1);
    let pills = '';
    for (let i = 0; i < ones; i++) {
      pills += `<div class="job-pill done" style="width:28px;background:#3a5a8c;border-color:#253d61;">
        <span class="j-idx" style="font-size:9px;">#${i + 1}</span>
        <span class="j-val" style="font-size:12px;">1</span>
      </div>`;
    }
    pills += `<div class="job-pill current" style="width:${Math.max(48, k * 28)}px;background:#c53030;border-color:#822727;">
      <span class="j-idx" style="font-size:9px;">#${ones + 1} (אחרונה)</span>
      <span class="j-val" style="font-size:13px;font-weight:bold;">${k}</span>
    </div>`;
    qBar.innerHTML = `<div class="queue-title">קלט הקצה (<span dir="ltr">k = ${k}</span>):</div><div class="job-pills" style="flex-wrap:wrap;max-height:64px;overflow-y:auto;gap:4px;">${pills}</div>`;
    return;
  }

  const isSorted = (step.mode === 'sorted');
  const jobs = isSorted ? SORTED_JOBS : UNSORTED_JOBS;
  const upTo = step.upTo !== undefined ? step.upTo : 7;
  const unitPx = isSorted ? 22 : 28;

  let pills = '';
  for (let i = 0; i < jobs.length; i++) {
    const len = jobs[i];
    const c = JOB_COLORS[len];
    let cls = 'job-pill';
    if (step.mode === 'unsorted' || step.mode === 'sorted') {
      if (i + 1 < upTo) cls += ' done';
      else if (i + 1 === upTo) cls += ' current';
    }
    pills += `<div class="${cls}" style="width:${len * unitPx}px;background:${c.fill};border-color:${c.border};">
      <span class="j-idx">j=${i + 1}</span>
      <span class="j-val">${len}</span>
    </div>`;
  }

  const titleText = isSorted
    ? 'תור ממוין (<span dir="ltr">LPT</span>):'
    : 'תור המשימות:';
  qBar.innerHTML = `<div class="queue-title">${titleText}</div><div class="job-pills">${pills}</div>`;
}

function renderPanels(step) {
  const container = document.getElementById('panelsContainer');

  if (step.mode === 'input_only') {
    container.className = 'panels';
    const emptyMachines = [[], [], []];
    container.innerHTML = `
      <div class="panel main-panel">
        <div class="panel-head">
          <div class="panel-title">הקלט: <span dir="ltr">k = 3</span> מכונות ו-<span dir="ltr">n = 7</span> משימות</div>
          <div class="panel-score" style="color:var(--navy)">T₁ = 0 , T₂ = 0 , T₃ = 0</div>
        </div>
        ${renderScheduleSVG(emptyMachines)}
      </div>`;
  } else if (step.mode === 'opt_only') {
    container.className = 'panels';
    container.innerHTML = `
      <div class="panel main-panel">
        <div class="panel-head">
          <div class="panel-title">הפתרון האופטימלי <span dir="ltr">S<sup>*</sup></span> (<span dir="ltr">M1: {6,3}=9 , M2: {5,4}=9 , M3: {4,3,3}=10</span>)</div>
          <div class="panel-score" style="color:var(--green)">OPT = 10</div>
        </div>
        ${renderScheduleSVG(OPT_MACHINES)}
      </div>`;
  } else if (step.mode === 'unsorted') {
    container.className = 'panels';
    const machines = buildPrefixMachines(UNSORTED_JOBS, UNSORTED_ASSIGN, step.upTo);
    const maxLoad = Math.max(...getLoads(machines));
    container.innerHTML = `
      <div class="panel main-panel">
        <div class="panel-head">
          <div class="panel-title">אלגוריתם חמדן (ללא מיון) — צעד ${step.upTo} מתוך 7</div>
          <div class="panel-score" style="color:${maxLoad > OPT_LOAD ? 'var(--red)' : 'var(--navy)'}">Makespan = ${maxLoad}</div>
        </div>
        ${renderScheduleSVG(machines, { chosenM: step.chosenM })}
      </div>`;
  } else if (step.mode === 'sorted') {
    container.className = 'panels';
    const machines = buildPrefixMachines(SORTED_JOBS, SORTED_ASSIGN, step.upTo);
    const maxLoad = Math.max(...getLoads(machines));
    container.innerHTML = `
      <div class="panel main-panel">
        <div class="panel-head">
          <div class="panel-title">אלגוריתם חמדן ממוין (<span dir="ltr">LPT</span>) — צעד ${step.upTo} מתוך 7</div>
          <div class="panel-score" style="color:var(--navy)">Makespan = ${maxLoad}</div>
        </div>
        ${renderScheduleSVG(machines, { chosenM: step.chosenM })}
      </div>`;
  } else if (step.mode === 'compare') {
    container.className = 'panels compare-grid';
    const unsortedFull = buildPrefixMachines(UNSORTED_JOBS, UNSORTED_ASSIGN, 7);
    const sortedFull = buildPrefixMachines(SORTED_JOBS, SORTED_ASSIGN, 7);

    container.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">1. חמדן ללא מיון (<span dir="ltr">3, 3, 3, 4, 5, 4, 6</span>)</div>
          <div class="panel-score" style="color:var(--red)">q(G) = 13</div>
        </div>
        ${renderScheduleSVG(unsortedFull, { width: 540, compact: true })}
      </div>
      <div class="panel main-panel">
        <div class="panel-head">
          <div class="panel-title">2. חמדן ממוין <span dir="ltr">LPT</span> (<span dir="ltr">6, 5, 4, 4, 3, 3, 3</span>)</div>
          <div class="panel-score" style="color:var(--navy)">q(G<sub>LPT</sub>) = 11</div>
        </div>
        ${renderScheduleSVG(sortedFull, { width: 540, compact: true })}
      </div>
      <div class="panel main-panel" style="grid-column: 1 / -1;">
        <div class="panel-head">
          <div class="panel-title">3. פתרון אופטימלי <span dir="ltr">S<sup>*</sup></span> (<span dir="ltr">{6,3}=9, {5,4}=9, {4,3,3}=10</span>)</div>
          <div class="panel-score" style="color:var(--green)">OPT = 10</div>
        </div>
        ${renderScheduleSVG(OPT_MACHINES, { width: 1080, compact: true })}
      </div>`;
  } else if (step.mode === 'tightness') {
    container.className = 'panels two-col';
    const k = tightK;
    const maxAxis = 2 * k;
    const unsortedTight = Array.from({ length: k }, (_, idx) => {
      const arr = Array.from({ length: k - 1 }, () => ({ len: 1 }));
      if (idx === 0) arr.push({ len: k, isLatest: true });
      return arr;
    });
    const optTight = Array.from({ length: k }, (_, idx) => {
      if (idx === 0) return [{ len: k }];
      return Array.from({ length: k }, () => ({ len: 1 }));
    });

    container.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">1. הרצת החמדן: משימה באורך <span dir="ltr">${k}</span> מגיעה אחרונה</div>
          <div class="panel-score" style="color:var(--red)">q(G) = 2k − 1 = ${2 * k - 1}</div>
        </div>
        ${renderScheduleSVG(unsortedTight, { width: 540, compact: true, maxAxis, optBound: k, optLabel: `OPT = ${k}`, avgBound: k, avgLabel: `Avg = ${k}` })}
      </div>
      <div class="panel main-panel">
        <div class="panel-head">
          <div class="panel-title">2. פתרון אופטימלי: משימה באורך <span dir="ltr">${k}</span> לבד, עבודות ה-1 מתחלקות שווה</div>
          <div class="panel-score" style="color:var(--green)">OPT = k = ${k}</div>
        </div>
        ${renderScheduleSVG(optTight, { width: 540, compact: true, maxAxis, optBound: k, optLabel: `OPT = ${k}`, avgBound: k, avgLabel: `Avg = ${k}` })}
      </div>`;
  }
}

function showStep(idx, pushHash = true) {
  const steps = buildSteps();
  currentStepIdx = Math.max(0, Math.min(steps.length - 1, idx));
  const st = steps[currentStepIdx];

  renderQueue(st);
  renderPanels(st);

  document.getElementById('captionText').innerHTML = st.caption;
  document.getElementById('formulaBox').innerHTML = st.formula;
  document.getElementById('counter').textContent = `${currentStepIdx + 1} / ${steps.length}`;

  document.getElementById('prevBtn').disabled = (currentStepIdx === 0);
  document.getElementById('nextBtn').disabled = (currentStepIdx === steps.length - 1);

  const optBtn = document.getElementById('optToggleBtn');
  optBtn.disabled = (currentStepIdx === 0);
  optBtn.classList.toggle('active', currentStepIdx >= 1 && showOptLine);

  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === st.tab);
  });

  const kSel = document.getElementById('kSelector');
  if (kSel) {
    kSel.classList.toggle('visible', st.mode === 'tightness');
  }

  if (pushHash) {
    history.replaceState(null, '', `#step=${currentStepIdx}`);
  }
}

document.querySelectorAll('.k-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    tightK = parseInt(btn.getAttribute('data-k'), 10);
    document.querySelectorAll('.k-btn').forEach(b => b.classList.toggle('active', b === btn));
    showStep(currentStepIdx, false);
  });
});

document.getElementById('nextBtn').addEventListener('click', () => showStep(currentStepIdx + 1));
document.getElementById('prevBtn').addEventListener('click', () => showStep(currentStepIdx - 1));
document.getElementById('resetBtn').addEventListener('click', () => showStep(0));

document.getElementById('optToggleBtn').addEventListener('click', (e) => {
  showOptLine = !showOptLine;
  e.currentTarget.classList.toggle('active', showOptLine);
  showStep(currentStepIdx, false);
});

document.getElementById('avgToggleBtn').addEventListener('click', (e) => {
  showAvgLine = !showAvgLine;
  e.currentTarget.classList.toggle('active', showAvgLine);
  showStep(currentStepIdx, false);
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    showStep(parseInt(btn.getAttribute('data-jump'), 10));
  });
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    showStep(currentStepIdx + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
    e.preventDefault();
    showStep(currentStepIdx - 1);
  } else if (e.key === 'Home') {
    e.preventDefault();
    showStep(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    showStep(buildSteps().length - 1);
  }
});

function syncFromHash() {
  const m = location.hash.match(/step=(\d+)/);
  showStep(m ? parseInt(m[1], 10) : 0, false);
}
window.addEventListener('hashchange', syncFromHash);
syncFromHash();
</script>
</body>
</html>
